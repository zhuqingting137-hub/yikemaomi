<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1420">
  <title>猫1 · 互动版（制作中）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1a1420; color: #fff; user-select: none;
    }
    #stage { position: relative; width: 100%; height: 100vh; overflow: hidden; }
    @supports (height: 100dvh) { #stage { height: 100dvh; } }
    #bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; animation: kenburns 12s ease-in-out infinite alternate;
    }
    @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.06); } }
    #note {
      position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
      z-index: 5; max-width: 82%; text-align: center;
      padding: 10px 16px; border-radius: 20px; background: rgba(0,0,0,.55);
      font-size: 14px; line-height: 1.7;
    }
    #back {
      position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 14px; z-index: 6;
      color: #c9b8d8; text-decoration: none; font-size: 13px;
      background: rgba(0,0,0,.4); padding: 8px 12px; border-radius: 16px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="bg" src="assets/img/cat1.jpg" alt="猫1">
    <div id="note">🐱 猫1 互动版正在制作中：<br>真实动作素材生成后马上上线</div>
    <a id="back" href="index.html">← 返回</a>
  </div>
</body>
</html>
