<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1420">
  <title>猫1 · 火腿肠互动演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 30%, #2b2136 0%, #1a1420 70%);
      color: #fff;
      touch-action: none;
      user-select: none;
    }
    #stage { position: relative; width: 100%; height: 100dvh; overflow: hidden; }

    #sofa {
      position: absolute; z-index: 1;
      filter: drop-shadow(0 14px 24px rgba(0,0,0,.45));
      pointer-events: none;
    }
    #cat {
      position: absolute; left: 0; top: 0; z-index: 2;
      transform-origin: bottom center;
      will-change: transform;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.4));
      pointer-events: none;
    }
    #sausage {
      position: absolute; left: 0; top: 0; z-index: 3;
      width: 60px; display: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.5));
      pointer-events: none;
    }

    #hint {
      position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%);
      z-index: 5; max-width: 78%; text-align: center;
      padding: 10px 18px; border-radius: 22px; background: rgba(0,0,0,.5);
      font-size: 14px; line-height: 1.6;
      transition: opacity .5s;
    }
    #badge {
      position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); z-index: 5;
      padding: 5px 14px; border-radius: 14px; background: rgba(0,0,0,.45);
      font-size: 12px; color: #ffd28a; white-space: nowrap;
      pointer-events: none;
    }
    #muteBtn {
      position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 14px; z-index: 6;
      width: 34px; height: 34px; border-radius: 50%; border: 0;
      background: rgba(0,0,0,.4); color: #fff; font-size: 16px; cursor: pointer;
    }
    #back {
      position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 14px; z-index: 6;
      color: #c9b8d8; text-decoration: none; font-size: 13px;
      background: rgba(0,0,0,.4); padding: 8px 12px; border-radius: 16px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="sofa" src="assets/img/sofa.png" alt="沙发">
    <img id="cat" src="assets/img/cat1_sprite.png" alt="狸花猫">
    <img id="sausage" src="assets/img/sausage.png" alt="火腿肠">
    <div id="badge">猫1 · 断尾伤腿狸花猫（演示版）</div>
    <button id="muteBtn">🔊</button>
    <a id="back" href="index.html">← 返回</a>
    <div id="hint">手指点哪里，火腿肠就出现在哪里，<br>猫会飞快跑过去～ 松手 3 秒后它回沙发</div>
  </div>
  <script src="js/cat1_game.js"></script>
</body>
</html>
